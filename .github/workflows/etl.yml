name: Daily ETL

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  workflow_dispatch:        # lets you run it manually

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python main.py
      - name: Commit updated database
        run: |
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add data/weather.db
          git diff --staged --quiet || git commit -m "Update weather data"
          git push